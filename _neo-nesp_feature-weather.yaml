lvgl:
  gradients: !include colors/SEASONS
  pages:
    - id: !extend menu_page
      on_load:
        - lvgl.widget.show:
            - menu_weather_button
      widgets:
        - label:
            id: menu_weather_label
            align: LEFT_MID
            x: 15
            y: -25
            text: "\U000F0599 00°C now"

    - id: !extend weather_page
      on_load:
        - script.execute:
            id: set_lvgl_page
            page_name: "weather_page"
      widgets:
        # XXX disabled: to enable, comment out bg_opa
        # XXX may need to also change text labels to black/white
        - obj:
            id: weather_bg
            width: 480
            height: 480
            radius: 240
            align: CENTER
            border_width: 0
            bg_opa: TRANSP
        - label:
            id: weather_icon_label
            align: CENTER
            y: -130
            text_font: roboto_huge
            text: "\U000F0599"
        - label:
            id: weather_temp_label
            align: CENTER
            y: -30
            x: -40
            text_font: roboto_huge
            text: "00°C"
        - label:
            id: weather_feels_like_label
            align: CENTER
            y: 50
            text: "Feels like 00°C"
        - label:
            id: weather_now_later_label
            align: CENTER
            y: 110
            text: "\U000F050F 00–00°C"
        - label:
            id: weather_aux_label
            align: CENTER
            y: 145
            text: "\U000F0599 00–00°C tmr."

script:
  - id: !extend goto_weather_page
    then:
      - lvgl.page.show:
          id: weather_page
          animation: FADE_IN
          time: 500ms

  - id: !extend feature_menu_goto_weather_page
    then:
      - script.execute: goto_weather_page

  # WEATHER UI LOGIC
  - id: update_weather_icon_label
    then:
      - lvgl.label.update:
          id: weather_icon_label
          text: !lambda |-
            static char buf[8];
            std::string icon;
            auto x = id(bom_icon).state;
            if (x.compare("mdi:weather-night") == 0) {
              icon = "\U000F0594";
            } else if (x.compare("mdi:weather-cloudy") == 0) {
              icon = "\U000F0590";
            } else if (x.compare("mdi:weather-hurricane") == 0) {
              icon = "\U000F0898";
            } else if (x.compare("mdi:weather-hazy") == 0) {
              icon = "\U000F0F30";
            } else if (x.compare("mdi:weather-fog") == 0) {
              icon = "\U000F0F91";
            } else if (x.compare("mdi:snowflake-melt") == 0) {
              icon = "\U000F12CB";
            } else if (x.compare("mdi:weather-pouring") == 0) {
              icon = "\U000F0596";
            } else if (x.compare("mdi:weather-partly-rainy") == 0) {
              icon = "\U000F0F33";
            } else if (x.compare("mdi:weather-light-showers") == 0) {
              icon = "\U000F0F33";    // mdi:partly-rainy, mdi:light-showers doesn't exist?
            } else if (x.compare("mdi:weather-sunny") == 0) {
              icon = "\U000F0599";
            } else if (x.compare("mdi:weather-partly-cloudy") == 0) {
              icon = "\U000F0595";
            } else if (x.compare("mdi:weather-rainy") == 0) {
              icon = "\U000F0597";
            } else if (x.compare("mdi:weather-snowy") == 0) {
              icon = "\U000F0598";
            } else if (x.compare("mdi:weather-lightning") == 0) {
              icon = "\U000F0593";    // not in BoM integration code last time I checked
            } else if (x.compare("mdi:weather-lightning-rainy") == 0) {
              icon = "\U000F0593";    // override with mdi:lightning
            } else if (x.compare("mdi:weather-windy") == 0) {
              icon = "\U000F059D";
            } else if (x.compare("mdi:weather-hail") == 0) {
              icon = "\U000F0592";    // not in BoM integration code last time I checked
            } else {
              icon = "";
            }
            snprintf(buf, sizeof(buf), "%s", icon.c_str());
            return buf;
      - lvgl.label.update:
          id: menu_weather_button_label
          text: !lambda |-
            static char buf[8];
            std::string icon;
            auto x = id(bom_icon).state;
            if (x.compare("mdi:weather-night") == 0) {
              icon = "\U000F0594";
            } else if (x.compare("mdi:weather-cloudy") == 0) {
              icon = "\U000F0590";
            } else if (x.compare("mdi:weather-hurricane") == 0) {
              icon = "\U000F0898";
            } else if (x.compare("mdi:weather-hazy") == 0) {
              icon = "\U000F0F30";
            } else if (x.compare("mdi:weather-fog") == 0) {
              icon = "\U000F0F91";
            } else if (x.compare("mdi:snowflake-melt") == 0) {
              icon = "\U000F12CB";
            } else if (x.compare("mdi:weather-pouring") == 0) {
              icon = "\U000F0596";
            } else if (x.compare("mdi:weather-partly-rainy") == 0) {
              icon = "\U000F0F33";
            } else if (x.compare("mdi:weather-light-showers") == 0) {
              icon = "\U000F0F33";    // mdi:partly-rainy, mdi:light-showers doesn't exist?
            } else if (x.compare("mdi:weather-sunny") == 0) {
              icon = "\U000F0599";
            } else if (x.compare("mdi:weather-partly-cloudy") == 0) {
              icon = "\U000F0595";
            } else if (x.compare("mdi:weather-rainy") == 0) {
              icon = "\U000F0597";
            } else if (x.compare("mdi:weather-snowy") == 0) {
              icon = "\U000F0598";
            } else if (x.compare("mdi:weather-lightning") == 0) {
              icon = "\U000F0593";    // not in BoM integration code last time I checked
            } else if (x.compare("mdi:weather-lightning-rainy") == 0) {
              icon = "\U000F0593";    // override with mdi:lightning
            } else if (x.compare("mdi:weather-windy") == 0) {
              icon = "\U000F059D";
            } else if (x.compare("mdi:weather-hail") == 0) {
              icon = "\U000F0592";    // not in BoM integration code last time I checked
            } else {
              icon = "";
            }
            snprintf(buf, sizeof(buf), "%s", icon.c_str());
            return buf;

  - id: update_weather_now_later_label
    then:
      - lvgl.label.update:
          id: weather_now_later_label
          text: !lambda |-
            static char buf[32];
            auto now = id(bom_now_temp).state;
            auto later = id(bom_later_temp).state;
            auto now_label = id(bom_now_label).state;
            auto later_label = id(bom_later_label).state;
            if (now_label.compare("Min") == 0 && later_label.compare("Max") == 0) {
              snprintf(buf, sizeof(buf), "\U000F050F %.0f–%.0f°C", now, later);
            } else if (now_label.compare("Max") == 0) {
              snprintf(buf, sizeof(buf), "\U000F0E03 %.0f°C max.", now);
            } else if (now_label.compare("Overnight min") == 0) {
              snprintf(buf, sizeof(buf), "\U000F0594 %.0f°C night", now);
            }
            return buf;

  - id: update_weather_aux_label
    then:
      - if:
          condition:
            lambda: 'return id(hass_time).now().hour >= 17;'
          then:
            # display tomorrow's temp after 17:00
            - script.execute: update_weather_aux_label_tmr_temp
          else:
            - if:
                condition:
                  or:
                    - lambda: 'return id(bom_pollen).state.compare("extreme") == 0;'
                    - lambda: 'return id(bom_pollen).state.compare("high") == 0;'
                then:
                  # display pollen if high to extreme
                  - script.execute: update_weather_aux_label_pollen
                else:
                  - if:
                      condition:
                        lambda: 'return id(bom_uv).state.compare("extreme") == 0;'
                      then:
                        # display UV if extreme
                        - script.execute: update_weather_aux_label_uv
                      else:
                        - if:
                            condition:
                              lambda: 'return id(bom_rain_chance).state >= 80;'
                            then:
                              # display rain if chance > 80%
                              - script.execute: update_weather_aux_label_rain
                            else:
                              # display UV by default during day
                              - script.execute: update_weather_aux_label_uv

  - id: update_weather_aux_label_tmr_temp
    then:
      - lvgl.label.update:
          id: weather_aux_label
          text: !lambda |-
            static char buf[32];
            std::string icon;
            auto low = id(bom_tmr_temp_low).state;
            auto high = id(bom_tmr_temp_high).state;
            auto x = id(bom_tmr_icon).state;
              if (x.compare("mdi:weather-night") == 0) {
                icon = "\U000F0594";
              } else if (x.compare("mdi:weather-cloudy") == 0) {
                icon = "\U000F0590";
              } else if (x.compare("mdi:weather-hurricane") == 0) {
                icon = "\U000F0898";
              } else if (x.compare("mdi:weather-hazy") == 0) {
                icon = "\U000F0F30";
              } else if (x.compare("mdi:weather-fog") == 0) {
                icon = "\U000F0F91";
              } else if (x.compare("mdi:snowflake-melt") == 0) {
                icon = "\U000F12CB";
              } else if (x.compare("mdi:weather-pouring") == 0) {
                icon = "\U000F0596";
              } else if (x.compare("mdi:weather-partly-rainy") == 0) {
                icon = "\U000F0F33";
              } else if (x.compare("mdi:weather-light-showers") == 0) {
                icon = "\U000F0F33";    // mdi:partly-rainy, mdi:light-showers doesn't exist?
              } else if (x.compare("mdi:weather-sunny") == 0) {
                icon = "\U000F0599";
              } else if (x.compare("mdi:weather-partly-cloudy") == 0) {
                icon = "\U000F0595";
              } else if (x.compare("mdi:weather-rainy") == 0) {
                icon = "\U000F0597";
              } else if (x.compare("mdi:weather-snowy") == 0) {
                icon = "\U000F0598";
              } else if (x.compare("mdi:weather-lightning") == 0) {
                icon = "\U000F0593";    // not in BoM integration code last time I checked
              } else if (x.compare("mdi:weather-lightning-rainy") == 0) {
                icon = "\U000F0593";    // override with mdi:lightning
              } else if (x.compare("mdi:weather-windy") == 0) {
                icon = "\U000F059D";
              } else if (x.compare("mdi:weather-hail") == 0) {
                icon = "\U000F0592";    // not in BoM integration code last time I checked
              } else {
                icon = "";
              }
            snprintf(buf, sizeof(buf), "%s %.0f–%.0f°C tmr.", icon.c_str(), low, high);
            return buf;

  - id: update_weather_aux_label_pollen
    then:
      - lvgl.label.update:
          id: weather_aux_label
          text:
            format: "\U000F1885 pollen %s"
            args: [ 'id(bom_pollen).state.c_str()' ]

  - id: update_weather_aux_label_uv
    then:
      - lvgl.label.update:
          id: weather_aux_label
          text:
            format: "\U000F1A45 UV %s"
            args: [ 'id(bom_uv).state.c_str()' ]

  - id: update_weather_aux_label_rain
    then:
      - lvgl.label.update:
          id: weather_aux_label
          text:
            format: "\U000F0596 %s mm"
            args: [ 'id(bom_rain).state.c_str()' ]

  - id: update_menu_weather_label
    then:
      - lvgl.label.update:
          id: menu_weather_label
          text: !lambda |-
            static char buf[48];
            std::string icon;
            auto x = id(bom_icon).state;
            auto temp = id(bom_temp).state;
            if (x.compare("mdi:weather-night") == 0) {
              icon = "\U000F0594";
            } else if (x.compare("mdi:weather-cloudy") == 0) {
              icon = "\U000F0590";
            } else if (x.compare("mdi:weather-hurricane") == 0) {
              icon = "\U000F0898";
            } else if (x.compare("mdi:weather-hazy") == 0) {
              icon = "\U000F0F30";
            } else if (x.compare("mdi:weather-fog") == 0) {
              icon = "\U000F0F91";
            } else if (x.compare("mdi:snowflake-melt") == 0) {
              icon = "\U000F12CB";
            } else if (x.compare("mdi:weather-pouring") == 0) {
              icon = "\U000F0596";
            } else if (x.compare("mdi:weather-partly-rainy") == 0) {
              icon = "\U000F0F33";
            } else if (x.compare("mdi:weather-light-showers") == 0) {
              icon = "\U000F0F33";    // mdi:partly-rainy, mdi:light-showers doesn't exist?
            } else if (x.compare("mdi:weather-sunny") == 0) {
              icon = "\U000F0599";
            } else if (x.compare("mdi:weather-partly-cloudy") == 0) {
              icon = "\U000F0595";
            } else if (x.compare("mdi:weather-rainy") == 0) {
              icon = "\U000F0597";
            } else if (x.compare("mdi:weather-snowy") == 0) {
              icon = "\U000F0598";
            } else if (x.compare("mdi:weather-lightning") == 0) {
              icon = "\U000F0593";    // not in BoM integration code last time I checked
            } else if (x.compare("mdi:weather-lightning-rainy") == 0) {
              icon = "\U000F0593";    // override with mdi:lightning
            } else if (x.compare("mdi:weather-windy") == 0) {
              icon = "\U000F059D";
            } else if (x.compare("mdi:weather-hail") == 0) {
              icon = "\U000F0592";    // not in BoM integration code last time I checked
            } else {
              icon = "";
            }
            snprintf(buf, sizeof(buf), "%s %.0f°C now", icon.c_str(), temp);
            return buf;

  # WEATHER SEASONAL BACKGROUND
  - id: set_weather_bg
    then:
      - lambda: |-
          auto now = id(hass_time).now();
          if (now.month >= 3 && now.month <= 5) {
            id(set_weather_bg_autumn).execute();
          } else if (now.month >= 6 && now.month <= 8) {
            id(set_weather_bg_winter).execute();
          } else if (now.month >= 9 && now.month <= 11) {
            id(set_weather_bg_spring).execute();
          } else if (now.month == 12 || now.month <= 2) {
            id(set_weather_bg_summer).execute();
          }
  - id: set_weather_bg_autumn
    then:
      - lvgl.widget.update:
          id: weather_bg
          bg_grad: autumn
  - id: set_weather_bg_winter
    then:
      - lvgl.widget.update:
          id: weather_bg
          bg_grad: winter
  - id: set_weather_bg_spring
    then:
      - lvgl.widget.update:
          id: weather_bg
          bg_grad: spring
  - id: set_weather_bg_summer
    then:
      - lvgl.widget.update:
          id: weather_bg
          bg_grad: summer
