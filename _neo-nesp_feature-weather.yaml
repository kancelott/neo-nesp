#
# neo-nesp optional feature: weather
#

esphome:
  name: !extend ${hostname}
  on_boot:
    - globals.set:
        id: feature_weather_enabled
        value: '1'

time:
  - id: !extend hass_time
    on_time_sync:
      then:
        - script.execute: set_weather_bg
    on_time:
      - hours: 0
        minutes: 0
        seconds: 0
        days_of_month: 1
        months: 3,6,9,12
        then:
          - script.execute: set_weather_bg
      - hours: 17
        minutes: 0
        seconds: 0
        then:
          - script.execute: update_weather_aux_label

sensor:
  ### HASS BoM - temperature
  - platform: homeassistant
    entity_id: ${weather_entity}
    attribute: temperature
    id: bom_temp
    internal: true
    filters:
      - round: 0
    on_value:
      - lvgl.label.update:
          id: weather_temp_label
          text:
            format: "%.0f°C"
            args: [ 'x' ]
      - script.execute: update_menu_weather_label

  ### HASS BoM - now temp
  - platform: homeassistant
    entity_id: ${weather_now_temp}
    id: bom_now_temp
    internal: true
    filters:
      - round: 0
    on_value:
      - script.execute: update_weather_now_later_label

  ### HASS BoM - later temp
  - platform: homeassistant
    entity_id: ${weather_later_temp}
    id: bom_later_temp
    internal: true
    filters:
      - round: 0
    on_value:
      - script.execute: update_weather_now_later_label

  ### HASS BoM - feels like temperature
  - platform: homeassistant
    entity_id: ${weather_feels_like}
    id: bom_feels_like
    internal: true
    filters:
      - round: 0
    on_value:
      - lvgl.label.update:
          id: weather_feels_like_label
          text:
            format: "Feels like %.0f°C"
            args: [ 'x' ]

  ### HASS BoM - forecast tomorrow low
  - platform: homeassistant
    entity_id: ${weather_tomorrow_temp_low}
    id: bom_tmr_temp_low
    internal: true
    filters:
      - round: 0
    on_value:
      - script.execute: update_weather_aux_label

  ### HASS BoM - forecast tomorrow high
  - platform: homeassistant
    entity_id: ${weather_tomorrow_temp_high}
    id: bom_tmr_temp_high
    internal: true
    filters:
      - round: 0
    on_value:
      - script.execute: update_weather_aux_label

  ### HASS BoM - rain chance
  - platform: homeassistant
    entity_id: ${weather_rain_chance}
    id: bom_rain_chance
    internal: true
    on_value:
      - script.execute: update_weather_aux_label

text_sensor:
  ### HASS BoM - weather icon
  - platform: homeassistant
    entity_id: ${weather_entity}
    attribute: icon
    id: bom_icon
    internal: true
    on_value:
      - script.execute: update_weather_icon_label
      - script.execute: update_menu_weather_label

  ### HASS BoM - weather text
  - platform: homeassistant
    entity_id: ${weather_text}
    id: bom_text
    internal: true
    filters:
      - to_lower:
      - substitute:
        - ". -> "

  ### HASS BoM - now temp label
  - platform: homeassistant
    entity_id: ${weather_now_label}
    id: bom_now_label
    internal: true
    on_value:
      - script.execute: update_weather_now_later_label

  ### HASS BoM - later temp label
  - platform: homeassistant
    entity_id: ${weather_later_label}
    id: bom_later_label
    internal: true
    on_value:
      - script.execute: update_weather_now_later_label

  ### HASS BoM - rain
  - platform: homeassistant
    entity_id: ${weather_rain}
    id: bom_rain
    internal: true
    on_value:
      - script.execute: update_weather_aux_label

  ### HASS BoM - UV forecast
  - platform: homeassistant
    entity_id: ${weather_uv}
    id: bom_uv
    internal: true
    filters:
      - to_lower:
      - substitute:
        - "unknown -> n/a"
    on_value:
      - script.execute: update_weather_aux_label

  ### HASS BoM - pollen
  - platform: homeassistant
    entity_id: ${weather_pollen}
    id: bom_pollen
    internal: true
    filters:
      - to_lower:
      - substitute:
        - "unknown -> n/a"
    on_value:
      - script.execute: update_weather_aux_label

  ### HASS BoM - weather tomorrow icon
  - platform: homeassistant
    entity_id: ${weather_tomorrow_icon}
    id: bom_tmr_icon
    internal: true
    on_value:
      - script.execute: update_weather_aux_label

  ### HASS BoM - weather tomorrow text
  - platform: homeassistant
    entity_id: ${weather_tomorrow_text}
    id: bom_tmr_text
    internal: true
    filters:
      - to_lower:
      - substitute:
        - ". -> "

button:
  - platform: template
    name: Show Weather screen
    on_press:
      - script.execute: goto_weather_page

