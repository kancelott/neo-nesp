#
# neo-nesp optional feature: train times
#

esphome:
  name: !extend ${hostname}
  on_boot:
    - globals.set:
        id: feature_train_enabled
        value: '1'

time:
  - id: !extend hass_time
    on_time:
      - hours: 8, 9
        minutes: 0
        seconds: 0
        days_of_week: MON-FRI
        then:
          # display train times 8am-9am weekdays
          # also need to update goto_home_page if changing this schedule
          - script.execute: goto_home_page

font:
  - id: !extend roboto_med
    extras:
      - file: "neo-nesp/fonts/materialdesignicons-webfont.ttf"
        glyphs: [
          "\U000F052C", # mdi:train
          ]
  - file: "neo-nesp/fonts/NETWORKSANS-2019-REGULAR.TTF"
    glyphs: ' 0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ°.:/+-%–*•'
    id: network_reg
    size: 28
    bpp: 4
  - file: "neo-nesp/fonts/NETWORKSANS-2019-REGULAR.TTF"
    glyphs: ' 0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ°.:/+-%–*•'
    id: network_med
    size: 48
    bpp: 4
  - file: "neo-nesp/fonts/NETWORKSANS-2019-BOLD.TTF"
    glyphs: ' 0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ°.:/+-%–*•'
    id: network_bold_reg
    size: 28
    bpp: 4
  - file: "neo-nesp/fonts/NETWORKSANS-2019-BOLD.TTF"
    glyphs: ' 0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ°.:/+-%–*•'
    id: network_bold_med
    size: 48
    bpp: 4

color:
  - id: sunbury_line
    red: 0.000
    green: 0.639
    blue: 1.000
    white: 0.000

lvgl:
  pages:
    - id: !extend menu_page
      on_load:
        - lvgl.widget.show:
            - menu_train_button

    - id: train_page
      on_load:
        - globals.set:
            id: active_lvgl_page
            value: '"train_page"'
      widgets:
        - label:
            id: next_train_label
            align: CENTER
            y: -205
            text_font: network_reg
            text: "Next train"
        - label:
            id: next_train_min_label
            align: CENTER
            y: -145
            text_font: network_bold_med
            text: "  0 min  "
            text_color: black
            bg_color: white
            bg_opa: COVER
        - obj:
            id: platform_bg_1
            width: 40
            height: 40
            align: LEFT_MID
            y: -50
            x: 15
            border_width: 0
            radius: 0
            bg_color: white
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: platform_label_1
                  align: CENTER
                  text_font: network_bold_reg
                  text: "1"
                  text_color: black
        - obj:
            id: platform_bg_2
            width: 40
            height: 40
            align: LEFT_MID
            y: 60
            x: 15
            border_width: 0
            radius: 0
            bg_color: white
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: platform_label_2
                  align: CENTER
                  text_font: network_bold_reg
                  text: "2"
                  text_color: black
        - obj:
            id: line_colour_1
            width: 12
            height: 80
            align: TOP_RIGHT
            align_to:
              id: platform_bg_1
              align: OUT_RIGHT_TOP
              x: 10
            border_width: 0
            radius: 0
            bg_color: sunbury_line
        - obj:
            id: line_colour_2
            width: 12
            height: 80
            align: TOP_RIGHT
            align_to:
              id: platform_bg_2
              align: OUT_RIGHT_TOP
              x: 10
            border_width: 0
            radius: 0
            bg_color: sunbury_line
        - label:
            id: departure_label_1
            align: TOP_RIGHT
            align_to:
              id: line_colour_1
              align: OUT_RIGHT_TOP
              x: 10
              y: -9
            text_font: network_bold_med
            text: "12:00 City Loop"
            text_align: LEFT
        - label:
            id: departure_label_2
            align: TOP_RIGHT
            align_to:
              id: line_colour_2
              align: OUT_RIGHT_TOP
              x: 10
              y: -9
            text_font: network_bold_med
            text: "13:00 Flinders St."
            text_align: LEFT
        - label:
            id: departure_detailed_label_1
            align: TOP_LEFT
            align_to:
              id: departure_label_1
              align: OUT_BOTTOM_LEFT
              y: 3
            text_font: network_reg
            text: "5 min delay - HCMT"
            text_align: LEFT
        - label:
            id: departure_detailed_label_2
            align: TOP_LEFT
            align_to:
              id: departure_label_2
              align: OUT_BOTTOM_LEFT
              y: 3
            text_font: network_reg
            text: "Comeng"
            text_align: LEFT

script:
  - id: !extend goto_train_page
    then:
      - lvgl.page.show:
          id: train_page
          animation: FADE_IN
          time: 500ms

  - id: !extend feature_menu_goto_train_page
    then:
      - script.execute: goto_train_page

  # TRAIN UI LOGIC

