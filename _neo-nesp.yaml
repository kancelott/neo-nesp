output:
  ### DISPLAY BACKLIGHT
  - platform: ledc
    id: display_led
    pin: 38
    zero_means_zero: true

light:
  - platform: monochromatic
    id: backlight
    output: display_led
    name: Backlight
    icon: mdi:brightness-percent
    default_transition_length: 500ms
    restore_mode: ALWAYS_ON

  ### RGB RING LIGHT
  - platform: esp32_rmt_led_strip
    name: RGB LED
    id: rgb_ring
    pin: 4
    num_leds: 13
    rmt_channel: 0
    rgb_order: GRB
    chipset: WS2812
    effects:
      - strobe:
          name: Pending
          colors:
            - state: True
              brightness: 100%
              red:   1.000
              green: 0.000
              blue:  0.000
              duration: 1000ms
            - state: False
              duration: 500ms
      - strobe:
          name: Arming
          colors:
            - state: True
              brightness: 100%
              red:   1.000
              green: 0.572
              blue:  0.000
              duration: 1000ms
            - state: False
              duration: 500ms
      - strobe:
          name: Police
          colors:
            - state: True
              brightness: 100%
              red:   1.000
              green: 0.000
              blue:  0.000
              duration: 100ms
            - state: False
              duration: 50ms
            - state: True
              brightness: 100%
              red:   1.000
              green: 0.000
              blue:  0.000
              duration: 100ms
            - state: False
              duration: 50ms
            - state: True
              brightness: 100%
              red:   1.000
              green: 0.000
              blue:  0.000
              duration: 100ms
            - state: False
              duration: 50ms
            - state: True
              brightness: 100%
              red:   1.000
              green: 0.000
              blue:  0.000
              duration: 100ms
            - state: False
              duration: 50ms
            - state: True
              brightness: 100%
              red:   0.000
              green: 0.000
              blue:  1.000
              duration: 100ms
            - state: False
              duration: 50ms
            - state: True
              brightness: 100%
              red:   0.000
              green: 0.000
              blue:  1.000
              duration: 100ms
            - state: False
              duration: 50ms
            - state: True
              brightness: 100%
              red:   0.000
              green: 0.000
              blue:  1.000
              duration: 100ms
            - state: False
              duration: 50ms
            - state: True
              brightness: 100%
              red:   0.000
              green: 0.000
              blue:  1.000
              duration: 100ms
            - state: False
              duration: 50ms

switch:
  ### VIBRATION MOTOR
  - platform: gpio
    id: vibration
    name: Vibration Motor
    icon: mdi:vibrate
    internal: true
    pin: 7

  ### DISPLAY ANTI BURN-IN
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    internal: true
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - light.turn_off: backlight
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - delay: 1s
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on: backlight

time:
  - platform: homeassistant
    id: hass_time
    on_time_sync:
      then:
        - script.execute: set_season_bg
    on_time:
      - hours: 0
        minutes: 0
        seconds: 0
        days_of_month: 1
        months: 3,6,9,12
        then:
          - script.execute: set_season_bg
      - hours: 2,3,4,5
        minutes: 0
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 2,3,4,5
        minutes: 45
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn
      - hours: 17
        minutes: 0
        seconds: 0
        then:
          - script.execute: update_weather_aux_label
      - hours: 0
        minutes: 0
        seconds: 0
        then:
          - script.execute: update_menu_date_label

binary_sensor:
  ### CENTRE PUSH BUTTON
  - platform: gpio
    name: Button
    id: push_button
    icon: mdi:circle-outline
    internal: true
    pin:
      number: 3
      mode: INPUT
      inverted: true
      ignore_strapping_warning: true
    on_press: 
      # - script.execute:
      #     id: vibrate
      #     length_ms: 10
      - light.turn_on: backlight
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - if:
          condition:
            # only when on the main page
            lambda: 'return strcmp(id(active_lvgl_page).c_str(), "main_page") == 0;'
          then:
            - script.execute: goto_menu_page

  - platform: status
    name: Status

button:
- platform: restart
  name: Restart
  disabled_by_default: True

sensor:
  - platform: uptime
    name: Uptime
    disabled_by_default: True

  ### ROTARY ENCODER
  - platform: rotary_encoder
    name: Rotary Encoder
    id: rotary
    icon: mdi:cached
    internal: true
    resolution: 2
    pin_a:
      number: 6
      inverted: true
      mode: INPUT
    pin_b:
      number: 5
      inverted: true
      mode: INPUT
    on_value:
      - light.turn_on: backlight
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
    on_clockwise:
      - if:
          condition:
            # set temp++ when on main page and not OFF or FAN
            lambda: 'return strcmp(id(active_lvgl_page).c_str(), "main_page") == 0 && strcmp(id(hvac_mode).state.c_str(), "off") != 0 && strcmp(id(hvac_mode).state.c_str(), "fan_only") != 0;'
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: ${climate_entity}
                  temperature: !lambda return id(set_temperature).state + 0.5;
    on_anticlockwise:
      - if:
          condition:
            # set temp-- when on main page and not OFF or FAN
            lambda: 'return strcmp(id(active_lvgl_page).c_str(), "main_page") == 0 && strcmp(id(hvac_mode).state.c_str(), "off") != 0 && strcmp(id(hvac_mode).state.c_str(), "fan_only") != 0;'
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: ${climate_entity}
                  temperature: !lambda return id(set_temperature).state - 0.5;

  ### HASS - HVAC SET TEMP
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: set_temperature
    attribute: temperature
    internal: true
    on_value:
      - lvgl.indicator.update:
          id: set_temp_needle
          value: !lambda return x * 10;
      - lvgl.indicator.update:
          id: diff_temp_arc
          start_value: !lambda |-
            return id(set_temperature).state < id(current_temperature).state ? id(set_temperature).state * 10 : id(current_temperature).state * 10;
          end_value: !lambda |-
            return id(set_temperature).state < id(current_temperature).state ? id(current_temperature).state * 10 : id(set_temperature).state * 10;
      - lvgl.roller.update:
          id: set_temp_roller
          selected_index: !lambda return 2 * (x - 16);  # returns index of roller value

  ### HASS - HVAC CURRENT TEMP
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: current_temperature
    attribute: current_temperature
    internal: true
    on_value:
      - lvgl.arc.update:
          id: current_temp_arc
          value: !lambda return x * 10;
      - lvgl.indicator.update:
          id: diff_temp_arc
          start_value: !lambda |-
            return id(set_temperature).state < id(current_temperature).state ? id(set_temperature).state * 10 : id(current_temperature).state * 10;
          end_value: !lambda |-
            return id(set_temperature).state < id(current_temperature).state ? id(current_temperature).state * 10 : id(set_temperature).state * 10;
      - lvgl.label.update:
          id: current_temp_label
          text:
            format: "%.1f°C"
            args: [ 'round(x * 10) / 10' ]

  ### HASS - HVAC CURRENT HUMIDITY
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: current_humidity
    attribute: current_humidity
    internal: true

  ### HASS - ZONE 1 TEMPERATURE
  - platform: homeassistant
    entity_id: ${zone_1_temp_entity}
    id: zone_1_temp
    internal: true
    on_value:
      - script.execute: update_zone_temp_label

  ### HASS - ZONE 2 TEMPERATURE
  - platform: homeassistant
    entity_id: ${zone_2_temp_entity}
    id: zone_2_temp
    internal: true
    on_value:
      - script.execute: update_zone_temp_label

  ### HASS BoM - temperature
  - platform: homeassistant
    entity_id: ${weather_entity}
    attribute: temperature
    id: bom_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_temp_label
          text:
            format: "%.0f°C"
            args: [ 'round(x)' ]

  ### HASS BoM - now temp
  - platform: homeassistant
    entity_id: ${weather_now_temp}
    id: bom_now_temp
    internal: true
    on_value:
      - script.execute: update_weather_now_later_label

  ### HASS BoM - later temp
  - platform: homeassistant
    entity_id: ${weather_later_temp}
    id: bom_later_temp
    internal: true
    on_value:
      - script.execute: update_weather_now_later_label

  ### HASS BoM - feels like temperature
  - platform: homeassistant
    entity_id: ${weather_feels_like}
    id: bom_feels_like
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_feels_like_label
          text:
            format: "Feels like %.0f°C"
            args: [ 'round(x)' ]

  ### HASS BoM - forecast tomorrow low
  - platform: homeassistant
    entity_id: ${weather_tomorrow_temp_low}
    id: bom_tmr_temp_low
    internal: true
    on_value:
      - script.execute: update_weather_aux_label

  ### HASS BoM - forecast tomorrow high
  - platform: homeassistant
    entity_id: ${weather_tomorrow_temp_high}
    id: bom_tmr_temp_high
    internal: true
    on_value:
      - script.execute: update_weather_aux_label

  ### HASS BoM - rain chance
  - platform: homeassistant
    entity_id: ${weather_rain_chance}
    id: bom_rain_chance
    internal: true
    on_value:
      - script.execute: update_weather_aux_label

text_sensor:
  ### HASS - HVAC MODE
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: hvac_mode
    internal: true
    on_value:
      - lambda: |-
          if (x.compare("off") == 0) {
            id(set_mode_off).execute();
          } else if (x.compare("heat") == 0) {
            id(set_mode_heat).execute();
          } else if (x.compare("cool") == 0) {
            id(set_mode_cool).execute();
          } else if (x.compare("fan_only") == 0) {
            id(set_mode_fan).execute();
          } else if (x.compare("dry") == 0) {
            id(set_mode_dry).execute();
          } else if (x.compare("heat_cool") == 0) {
            id(set_mode_heat_cool).execute();
          }

  ### HASS - HVAC FAN SPEED
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: fan_mode
    attribute: fan_mode
    internal: true
    on_value:
      - lambda: |-
          if (x.compare("auto") == 0) {
            id(set_fan_auto).execute();
          } else if (x.compare("low") == 0) {
            id(set_fan_low).execute();
          } else if (x.compare("medium") == 0) {
            id(set_fan_medium).execute();
          } else if (x.compare("high") == 0) {
            id(set_fan_high).execute();
          }

  ### HASS - HVAC PRESET
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: preset_mode
    attribute: preset_mode
    internal: true
    on_value:
      - lambda: |-
          if (x.compare("none") == 0) {
            id(set_preset_none).execute();
          } else if (x.compare("eco") == 0) {
            id(set_preset_eco).execute();
          } else if (x.compare("comfort") == 0) {
            id(set_preset_comfort).execute();
          } else if (x.compare("boost") == 0) {
            id(set_preset_boost).execute();
          }

    ### HASS - ZONES
  - platform: homeassistant
    entity_id: ${zone_1_entity}
    id: zone_1
    internal: true
    on_value:
      - lambda: |-
          if (x.compare("open") == 0) {
            id(set_zone_1).execute();
          } else if (x.compare("closed") == 0) {
            id(unset_zone_1).execute();
          }
  - platform: homeassistant
    entity_id: ${zone_2_entity}
    id: zone_2
    internal: true
    on_value:
      - lambda: |-
          if (x.compare("open") == 0) {
            id(set_zone_2).execute();
          } else if (x.compare("closed") == 0) {
            id(unset_zone_2).execute();
          }

  ### HASS BoM - weather icon
  - platform: homeassistant
    entity_id: ${weather_entity}
    attribute: icon
    id: bom_icon
    internal: true
    on_value:
      - script.execute: update_weather_icon_label

  ### HASS BoM - weather text
  - platform: homeassistant
    entity_id: ${weather_text}
    id: bom_text
    internal: true
    filters:
      - to_lower:
      - substitute:
        - ". -> "

  ### HASS BoM - now temp label
  - platform: homeassistant
    entity_id: ${weather_now_label}
    id: bom_now_label
    internal: true
    on_value:
      - script.execute: update_weather_now_later_label

  ### HASS BoM - later temp label
  - platform: homeassistant
    entity_id: ${weather_later_label}
    id: bom_later_label
    internal: true
    on_value:
      - script.execute: update_weather_now_later_label

  ### HASS BoM - rain
  - platform: homeassistant
    entity_id: ${weather_rain}
    id: bom_rain
    internal: true
    on_value:
      - script.execute: update_weather_aux_label
      - lvgl.label.update:
          id: menu_weather_rain_label
          text:
            format: "\U000F0596 %smm"
            args: [ 'x.c_str()' ]

  ### HASS BoM - UV forecast
  - platform: homeassistant
    entity_id: ${weather_uv}
    id: bom_uv
    internal: true
    filters:
      - to_lower:
      - substitute:
        - "unknown -> n/a"
    on_value:
      - script.execute: update_weather_aux_label
      - lvgl.label.update:
          id: menu_weather_uv_label
          text:
            format: "\U000F1A45 UV %s"
            args: [ 'x.c_str()' ]

  ### HASS BoM - pollen
  - platform: homeassistant
    entity_id: ${weather_pollen}
    id: bom_pollen
    internal: true
    filters:
      - to_lower:
      - substitute:
        - "unknown -> n/a"
    on_value:
      - script.execute: update_weather_aux_label
      - lvgl.label.update:
          id: menu_weather_pollen_label
          text:
            format: "\U000F1885 pollen %s"
            args: [ 'x.c_str()' ]

  ### HASS BoM - weather tomorrow icon
  - platform: homeassistant
    entity_id: ${weather_tomorrow_icon}
    id: bom_tmr_icon
    internal: true
    on_value:
      - script.execute: update_weather_aux_label

  ### HASS BoM - weather tomorrow text
  - platform: homeassistant
    entity_id: ${weather_tomorrow_text}
    id: bom_tmr_text
    internal: true
    filters:
      - to_lower:
      - substitute:
        - ". -> "

    ### HASS - Alarm
  - platform: homeassistant
    entity_id: ${alarm_entity}
    id: alarm_state
    internal: true
    on_value:
    - lambda: |-
        if (x.compare("disarmed") == 0) {
          id(update_alarm_disarmed).execute();
        } else if (x.compare("arming") == 0) {
          id(update_alarm_arming).execute();
        } else if (x.compare("armed_away") == 0 || x.compare("armed_home") == 0 || x.compare("armed_night") == 0 || x.compare("armed_vacation") == 0 || x.compare("armed_custom_bypass") == 0) {
          id(update_alarm_armed).execute();
        } else if (x.compare("pending") == 0) {
          id(update_alarm_pending).execute();
        } else if (x.compare("disarming") == 0) {
          id(update_alarm_disarming).execute();
        } else if (x.compare("triggered") == 0) {
          id(update_alarm_triggered).execute();
        }

  ### HASS - Perimeter Trigger
  - platform: homeassistant
    entity_id: ${perimeter_entity}
    id: perimeter
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x.compare("") == 0;'
          then:
            - lvgl.label.update:
                id: perimeter_label
                text: " "
          else:
            - lvgl.label.update:
                id: perimeter_label
                text: !lambda |-
                  static char buf[40];
                  snprintf(buf, sizeof(buf), "  \U000F081C %s  ", x.c_str());
                  return buf;

  - platform: debug
    reset_reason:
      name: Reset Reason
      disabled_by_default: True

number:
  - platform: template
    name: Display Timeout
    id: display_timeout
    optimistic: true
    unit_of_measurement: "s"
    initial_value: 300
    restore_value: true
    min_value: 30
    max_value: 3600
    step: 30
    mode: box

spi:
  ### DISPLAY
  clk_pin:
    number: 47
    allow_other_uses: true
  mosi_pin:
    number: 41
    allow_other_uses: true
display:
  - platform: st7701s
    id: screen
    spi_mode: MODE0
    data_rate: 10MHz
    color_order: RGB
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 480
      height: 480
    cs_pin: 21
    de_pin: 39
    vsync_pin: 48
    hsync_pin: 40
    pclk_pin:
      number: 45
      ignore_strapping_warning: true
    pclk_frequency: 15MHz
    pclk_inverted: false
    hsync_pulse_width: 10
    hsync_back_porch:  10
    hsync_front_porch: 10
    vsync_pulse_width:  2
    vsync_back_porch:  12
    vsync_front_porch: 14
    data_pins:
      blue:
        - number: 47                # LCD_D0  = b0
          allow_other_uses: true
        - number: 41                # LCD_D1  = b1
          allow_other_uses: true
        - 0                         # LCD_D2  = b2
        - 42                        # LCD_D3  = b3
        - 14                        # LCD_D4  = b4
      green:
        - 8                         # LCD_D5  = g0
        - 13                        # LCD_D6  = g1
        - 18                        # LCD_D7  = g2
        - 12                        # LCD_D8  = g3
        - 11                        # LCD_D9  = g4
        - 17                        # LCD_D10 = g5
      red:
        - 10                        # LCD_D11 = r0
        - 16                        # LCD_D12 = r1
        - 9                         # LCD_D13 = r2
        - 15                        # LCD_D14 = r3
        - 46                        # LCD_D15 = r4
    init_sequence:
      # Reference: wireless-tag sample code: 
      # https://github.com/wireless-tag-com/ZX2D10GE01R-V4848/blob/master/main/screen.c
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]    # CMD2_BKSEL (command bank select BK3, BK func enabled)
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]    # CMD2_BKSEL (command bank select BK0, BK func disabled)
      - [0xC0, 0x3B, 0x00]                      # Scan line
      - [0xC1, 0x0B, 0x02]                      # VBP
      - [0xC2, 0x07, 0x02]
      - [0xCC, 0x10]
      - [0xCD, 0x08]                            # RGB format | ?565??? 666??
      - [0xB0, 0x00, 0x11, 0x16, 0x0e, 0x11, 0x06, 0x05, 0x09, 0x08, 0x21, 0x06, 0x13, 0x10, 0x29, 0x31, 0x18]   # IPS | 255 | 251 | 247 down | 239 | 231 | 203 | 175 | 147 | 108 | 80 | 52 | 24 | 16 | 8 down | 4 | 0
      - [0xB1, 0x00, 0x11, 0x16, 0x0e, 0x11, 0x07, 0x05, 0x09, 0x09, 0x21, 0x05, 0x13, 0x11, 0x2a, 0x31, 0x18]   # IPS | 255 | 251 | 247 down | 239 | 231 | 203 | 175 | 147 | 108 | 80 | 52 | 24 | 16 | 8 down | 4 | 0
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x6d]                            # VOP  3.5375+ *x 0.0125 | 5D
      - [0xB1, 0x37]                            # VCOM amplitude setting
      - [0xB2, 0x81]                            # VGH Voltage setting | 12V
      - [0xB3, 0x80]
      - [0xB5, 0x43]                            # VGL Voltage setting | -8.3V
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]    # CMD2_BKSEL (command bank select BK3, BK func enabled)
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]    # CMD2_BKSEL (command bank select BK0, BK func disabled)
      - [0x36, 0x00]                            # MADCTL_CMD (already in esphome ST7701S::write_init_sequence_)
      - [0x3A, 0x66]                            # COLMOD 55/50=16bit(RGB565); 66=18bit(RGB666); 77?????3AH?=24bit(RGB888)
      # - [0x11]                                  # SLEEP_OUT (already in esphome)
      # - delay 120ms
      # - [0x29]                                  # DISPLAY_ON (already in esphome)
      # - delay 20ms

