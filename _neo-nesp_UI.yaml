    ### GUI - ALARM KEYPAD
    - id: alarm_page
      on_load:
        - globals.set:
            id: active_lvgl_page
            value: '"alarm_page"'
        - lvgl.widget.enable:
            - alarm_keypad
        - lvgl.widget.focus:
            id: alarm_keypad
            editing: True
            freeze: True
      on_unload:
        - lvgl.widget.disable:
            - alarm_keypad
      widgets:
        - arc:
            id: alarm_bg
            height: 480
            width: 480
            align: CENTER
            arc_color: graylight
            arc_opa: COVER
            arc_width: 20
            start_angle: 0
            end_angle: 360
        - label:
            id: alarm_label
            align: CENTER
            y: -160
            text: "HOME SECURITY"
        - textarea:
            id: alarm_pin
            state:
              disabled: True
            width: 200
            align: CENTER
            y: -100
            one_line: True
            password_mode: True
            bg_opa: TRANSP
            text_align: CENTER
        - buttonmatrix:
            id: alarm_keypad
            state:
              disabled: True
            width: 300
            height: 250
            align: BOTTOM_MID
            y: -55
            bg_opa: TRANSP
            border_opa: TRANSP
            edited:
              outline_width: 0
            items:
              edited:
                outline_color: pure_cyan
                outline_width: 3
                outline_pad: 3
            rows:
              - buttons:
                  - text: 1
                    control:
                      no_repeat: True
                  - text: 2
                    control:
                      no_repeat: True
                  - text: 3
                    control:
                      no_repeat: True
              - buttons:
                  - text: 4
                    control:
                      no_repeat: True
                  - text: 5
                    control:
                      no_repeat: True
                  - text: 6
                    control:
                      no_repeat: True
              - buttons:
                  - text: 7
                    control:
                      no_repeat: True
                  - text: 8
                    control:
                      no_repeat: True
                  - text: 9
                    control:
                      no_repeat: True
              - buttons:
                  - text: "\uF55A"
                    key_code: "*"
                    control:
                      no_repeat: True
                  - text: 0
                    control:
                      no_repeat: True
                  - text: "\uF00C"
                    key_code: "#"
                    control:
                      no_repeat: True
