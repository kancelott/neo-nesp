globals:
  - id: active_lvgl_page
    type: std::string

### For alarm pincode entry
key_collector:
  - source_id: alarm_keypad
    max_length: 4
    end_keys: "#"
    end_key_required: False
    back_keys: "*"
    allowed_keys: "0123456789*#"
    timeout: 10s
    on_progress:
      - if:
          condition:
            lambda: return (x.compare(std::string{""}) != 0);
          then:
            - lvgl.textarea.update:
                id: alarm_pin
                text: !lambda 'return x.c_str();'
    on_result:
      - homeassistant.action:
          action: alarm_control_panel.alarm_disarm
          data:
            entity_id: ${alarm_entity}
            code: !lambda 'return x.c_str();'
      - lvgl.textarea.update:
          id: alarm_pin
          text: ""
    on_timeout:
      - lvgl.textarea.update:
          id: alarm_pin
          text: ""

lvgl:
  encoders:
    enter_button: push_button
    sensor: rotary
  bg_color: black
  scrollbar_mode: "OFF"
  default_font: roboto_reg
  text_color: white
  style_definitions:
