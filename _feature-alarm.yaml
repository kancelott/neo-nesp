#
# neo-nesp optional feature: alarm keypad
#

esphome:
  name: !extend ${hostname}
  on_boot:
    - globals.set:
        id: feature_alarm_enabled
        value: '1'

text_sensor:
    ### HASS - Alarm
  - platform: homeassistant
    entity_id: ${alarm_entity}
    id: alarm_state
    internal: true
    on_value:
    - lambda: |-
        if (x.compare("disarmed") == 0) {
          id(update_alarm_disarmed).execute();
        } else if (x.compare("arming") == 0) {
          id(update_alarm_arming).execute();
        } else if (x.compare("armed_away") == 0 || x.compare("armed_home") == 0 || x.compare("armed_night") == 0 || x.compare("armed_vacation") == 0 || x.compare("armed_custom_bypass") == 0) {
          id(update_alarm_armed).execute();
        } else if (x.compare("pending") == 0) {
          id(update_alarm_pending).execute();
        } else if (x.compare("disarming") == 0) {
          id(update_alarm_disarming).execute();
        } else if (x.compare("triggered") == 0) {
          id(update_alarm_triggered).execute();
        }

  ### HASS - Perimeter Trigger
  - platform: homeassistant
    entity_id: ${alarm_perimeter_entity}
    id: perimeter
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x.compare("") == 0;'
          then:
            - lvgl.label.update:
                id: perimeter_hvac_label
                text: " "
            - lvgl.label.update:
                id: perimeter_weather_label
                text: " "
            - lvgl.label.update:
                id: perimeter_train_label
                text: " "
            - lvgl.widget.hide:
                - perimeter_hvac_bg
                - perimeter_hvac_label
                - perimeter_weather_bg
                - perimeter_weather_label
                - perimeter_train_bg
                - perimeter_train_bg2
                - perimeter_train_label
          else:
            - lvgl.label.update:
                id: perimeter_hvac_label
                text: !lambda |-
                  static char buf[40];
                  snprintf(buf, sizeof(buf), "  \U000F081C %s  ", x.c_str());
                  return buf;
            - lvgl.label.update:
                id: perimeter_weather_label
                text: !lambda |-
                  static char buf[40];
                  snprintf(buf, sizeof(buf), "  \U000F081C %s  ", x.c_str());
                  return buf;
            - lvgl.label.update:
                id: perimeter_train_label
                text: !lambda |-
                  static char buf[40];
                  snprintf(buf, sizeof(buf), "  \U000F081C %s  ", x.c_str());
                  return buf;
            - lvgl.widget.show:
                - perimeter_hvac_bg
                - perimeter_hvac_label
                - perimeter_weather_bg
                - perimeter_weather_label
                - perimeter_train_bg
                - perimeter_train_bg2
                - perimeter_train_label

