key_collector:
    ### For alarm pincode entry
  - source_id: alarm_keypad
    max_length: 4
    end_keys: "#"
    end_key_required: False
    back_keys: "*"
    allowed_keys: "0123456789*#"
    timeout: 15s
    on_progress:
      - lvgl.textarea.update:
          id: alarm_pin
          text: !lambda 'return x.c_str();'
    on_result:
      - homeassistant.action:
          action: alarm_control_panel.alarm_disarm
          data:
            entity_id: ${alarm_entity}
            code: !lambda 'return x.c_str();'
      - lvgl.textarea.update:
          id: alarm_pin
          text: ""
    on_timeout:
      - lvgl.textarea.update:
          id: alarm_pin
          text: ""

font:
  - id: !extend roboto_reg
    extras:
      - file: "neo-nesp/fonts/FontAwesome5-Solid+Brands+Regular.woff"
        glyphs: [
          "\uF00C", # checkmark
          "\uF55A", # backspace
          ]
      - file: "neo-nesp/fonts/materialdesignicons-webfont.ttf"
        glyphs: [
          "\U000F099D", # mdi:shield-lock
          "\U000F099E", # mdi:shield-off
          "\U000F081C", # mdi:door-open
          ]
  - id: !extend roboto_med
    extras:
      - file: "neo-nesp/fonts/materialdesignicons-webfont.ttf"
        glyphs: [
          "\U000F099D", # mdi:shield-lock
          "\U000F099E", # mdi:shield-off
          "\U000F081C", # mdi:door-open
          ]

lvgl:
  pages:
    - id: !extend hvac_page
      widgets:
        - arc:
            id: perimeter_hvac_bg
            hidden: True
            height: 468
            width: 468
            align: CENTER
            start_angle: 60
            end_angle: 120
            arc_color: black
            arc_width: 55
            arc_rounded: False
        - label:
            id: perimeter_hvac_label
            hidden: True
            align: BOTTOM_MID
            y: -27
            text_align: CENTER
            text_color: red
            bg_color: black
            bg_opa: COVER
            text: " "

    - id: !extend weather_page
      widgets:
        - arc:
            id: perimeter_weather_bg
            hidden: True
            height: 468
            width: 468
            align: CENTER
            start_angle: 60
            end_angle: 120
            arc_color: black
            arc_width: 55
            arc_rounded: False
        - label:
            id: perimeter_weather_label
            hidden: True
            align: BOTTOM_MID
            y: -27
            text_align: CENTER
            text_color: red
            bg_color: black
            bg_opa: COVER
            text: " "

    - id: !extend train_page
      widgets:
        - arc:
            id: perimeter_train_bg
            hidden: True
            height: 468
            width: 468
            align: CENTER
            start_angle: 60
            end_angle: 120
            arc_color: black
            arc_width: 55
            arc_rounded: False
        - obj:
            id: perimeter_train_bg2
            hidden: True
            height: 70
            width: 100
            align: BOTTOM_MID
            border_width: 0
            bg_color: black
            bg_opa: COVER
        - label:
            id: perimeter_train_label
            hidden: True
            align: BOTTOM_MID
            y: -27
            text_align: CENTER
            text_color: red
            bg_color: black
            bg_opa: COVER
            text: " "

    - id: !extend menu_page
      on_load:
        - lvgl.widget.show:
            - menu_arm_button

    ### GUI - ALARM KEYPAD
    - id: !extend alarm_page
      on_load:
        - script.execute:
            id: set_lvgl_page
            page_name: "alarm_page"
        - lvgl.widget.enable:
            - alarm_keypad
        - lvgl.widget.focus:
            id: alarm_keypad
            editing: True
            freeze: True
      on_unload:
        - lvgl.widget.disable:
            - alarm_keypad
      widgets:
        - arc:
            id: alarm_bg
            height: 480
            width: 480
            align: CENTER
            arc_color: graylight
            arc_opa: COVER
            arc_width: 20
            start_angle: 0
            end_angle: 360
        - label:
            id: alarm_label
            align: CENTER
            y: -160
            text: "HOME SECURITY"
        - textarea:
            id: alarm_pin
            state:
              disabled: True
            width: 200
            align: CENTER
            y: -100
            one_line: True
            password_mode: True
            bg_opa: TRANSP
            text_align: CENTER
        - buttonmatrix:
            id: alarm_keypad
            state:
              disabled: True
            width: 300
            height: 250
            align: BOTTOM_MID
            y: -55
            bg_opa: TRANSP
            border_opa: TRANSP
            edited:
              outline_width: 0
            items:
              edited:
                outline_color: pure_cyan
                outline_width: 3
                outline_pad: 3
            rows:
              - buttons:
                  - text: 1
                    control:
                      no_repeat: True
                  - text: 2
                    control:
                      no_repeat: True
                  - text: 3
                    control:
                      no_repeat: True
              - buttons:
                  - text: 4
                    control:
                      no_repeat: True
                  - text: 5
                    control:
                      no_repeat: True
                  - text: 6
                    control:
                      no_repeat: True
              - buttons:
                  - text: 7
                    control:
                      no_repeat: True
                  - text: 8
                    control:
                      no_repeat: True
                  - text: 9
                    control:
                      no_repeat: True
              - buttons:
                  - text: "\uF55A"
                    key_code: "*"
                    control:
                      no_repeat: True
                  - text: 0
                    control:
                      no_repeat: True
                  - text: "\uF00C"
                    key_code: "#"
                    control:
                      no_repeat: True

script:
  - id: !extend goto_alarm_page
    then:
      - lvgl.page.show:
          id: alarm_page
          animation: FADE_IN
          time: 500ms

  - id: !extend feature_menu_alarm_arm
    then:
      - homeassistant.action:
          action: alarm_control_panel.alarm_arm_away
          data:
            entity_id: ${alarm_entity}

  # ALARM UI LOGIC
  - id: update_alarm_disarmed
    then:
      - lvgl.label.update:
          id: alarm_label
          text: "DISARMED"
      - lvgl.widget.update:
          id: alarm_bg
          arc_color: graylight
      - light.turn_off: rgb_ring
      - script.execute: goto_home_page

  - id: update_alarm_arming
    then:
      - lvgl.label.update:
          id: alarm_label
          text: "ARMING"
      - light.turn_on:
          id: rgb_ring
          effect: "Arming"
      - lvgl.widget.update:
          id: alarm_bg
          arc_color: deep_orange
      - script.execute: goto_alarm_page

  - id: update_alarm_armed
    then:
      - lvgl.label.update:
          id: alarm_label
          text: "ARMED"
      - light.turn_off: rgb_ring
      - light.turn_on:
          id: rgb_ring
          brightness: 100%
          red:   1.000
          green: 0.000
          blue:  0.000
      - lvgl.widget.update:
          id: alarm_bg
          arc_color: red
      - script.execute: goto_alarm_page

  - id: update_alarm_pending
    then:
      - lvgl.label.update:
          id: alarm_label
          text: "ARMED"
      - light.turn_on:
          id: rgb_ring
          effect: "Pending"
      - lvgl.widget.update:
          id: alarm_bg
          arc_color: red
      - script.execute: goto_alarm_page

  - id: update_alarm_disarming
    then:
      - lvgl.label.update:
          id: alarm_label
          text: "DISARMING"
      - light.turn_on:
          id: rgb_ring
          effect: "Pending"
      - lvgl.widget.update:
          id: alarm_bg
          arc_color: red
      - script.execute: goto_alarm_page

  - id: update_alarm_triggered
    then:
      - lvgl.label.update:
          id: alarm_label
          text: "ALARM!"
      - lvgl.widget.update:
          id: alarm_bg
          bg_color: red
      - light.turn_on:
          id: rgb_ring
          effect: "Police"
      - script.execute: goto_alarm_page
