#
# neo-nesp optional feature: battery grid & electricity consumption readout
#

esphome:
  name: !extend ${hostname}
  on_boot:
    - globals.set:
        id: feature_battery_enabled
        value: '1'

sensor:
  ### HASS - BATTERY SoC %
  - platform: homeassistant
    entity_id: ${battery_bat_soc_entity}
    id: battery_bat_soc
    internal: true
    filters:
      - round: 0
    on_value:
      - script.execute: update_menu_battery_label
      - script.execute: update_bat_soc_arc

  ### HASS - SOLAR GENERATION kW
  - platform: homeassistant
    entity_id: ${battery_solar_entity}
    id: battery_solar
    internal: true
    filters:
      - round: 1
    on_value:
      - script.execute: update_menu_battery_label
      - script.execute: update_bat_arc
      - script.execute: update_load_arc

  ### HASS - HOUSE CONSUMPTION kW
  - platform: homeassistant
    entity_id: ${battery_house_load_entity}
    id: battery_house_load
    internal: true
    filters:
      - round: 1
    on_value:
      - script.execute: update_battery_label
      - script.execute: update_bat_arc
      - script.execute: update_load_arc

  ### HASS - GRID IMPORT kW
  - platform: homeassistant
    entity_id: ${battery_grid_import_entity}
    id: battery_grid_import
    internal: true
    filters:
      - round: 1
    on_value:
      - script.execute: update_battery_label
      - script.execute: update_bat_arc
      - script.execute: update_load_arc

  ### HASS - GRID EXPORT kW
  - platform: homeassistant
    entity_id: ${battery_grid_export_entity}
    id: battery_grid_export
    internal: true
    filters:
      - round: 1
    on_value:
      - script.execute: update_battery_label
      - script.execute: update_bat_arc
      - script.execute: update_load_arc

  ### HASS - BATTERY CHARGE kW
  - platform: homeassistant
    entity_id: ${battery_bat_charge_entity}
    id: battery_bat_charge
    internal: true
    filters:
      - round: 1
    on_value:
      - script.execute: update_bat_soc_arc
      - script.execute: update_bat_arc
      - script.execute: update_load_arc

  ### HASS - BATTERY DISCHARGE kW
  - platform: homeassistant
    entity_id: ${battery_bat_discharge_entity}
    id: battery_bat_discharge
    internal: true
    filters:
      - round: 1
    on_value:
      - script.execute: update_battery_label
      - script.execute: update_bat_arc
      - script.execute: update_load_arc

font:
  - id: !extend roboto_reg
    extras:
      - file: "neo-nesp/fonts/materialdesignicons-webfont.ttf"
        glyphs: [
          "\U000F1901", # mdi:home-battery
          "\U000F1A73", # mdi:solar-power-variant
          "\U000F1903", # mdi:home-lightning-bolt
          "\U000F192C", # mdi:transmission-tower-export
          "\U000F192D", # mdi:transmission-tower-import
          "\U000F1902", # mdi:home-battery-outline
          ]

