script:
  - id: update_menu_battery_label
    then:
      - lvgl.label.update:
          id: menu_battery_label
          text:
            format: "\U000F1901 %.0f%%      \U000F1A73 %.1f kW"
            args: [ 'id(battery_bat_soc).state', 'id(battery_solar).state' ]

  - id: update_battery_label
    then:
      - if:
          condition:
            lambda: 'return id(battery_grid_export).state > 4.5;'
          then:
            # status: grid export
            - lvgl.label.update:
                id: hvac_battery_label
                text:
                  format: "\U000F1902 %.1f kW"
                  args: [ 'id(battery_bat_discharge).state' ]
            - lvgl.label.update:
                id: weather_battery_label
                text:
                  format: "\U000F1902 %.1f kW"
                  args: [ 'id(battery_bat_discharge).state' ]
            - lvgl.label.update:
                id: hvac_battery_label
                text_color: color_battery_bat
            - lvgl.label.update:
                id: weather_battery_label
                text_color: color_battery_bat
          else:
            if:
              condition:
                lambda: 'return id(battery_grid_import).state > 0.1;'
              then:
                # status: grid import
                - lvgl.label.update:
                    id: hvac_battery_label
                    text:
                      format: "\U000F192D %.1f kW"
                      args: [ 'id(battery_grid_import).state' ]
                - lvgl.label.update:
                    id: weather_battery_label
                    text:
                      format: "\U000F192D %.1f kW"
                      args: [ 'id(battery_grid_import).state' ]
                - lvgl.label.update:
                    id: hvac_battery_label
                    text_color: color_battery_grid
                - lvgl.label.update:
                    id: weather_battery_label
                    text_color: color_battery_grid
              else:
                # status: normal home consumption
                - lvgl.label.update:
                    id: hvac_battery_label
                    text:
                      format: "\U000F1903 %.1f kW"
                      args: [ 'id(battery_house_load).state' ]
                - lvgl.label.update:
                    id: weather_battery_label
                    text:
                      format: "\U000F1903 %.1f kW"
                      args: [ 'id(battery_house_load).state' ]
                - lvgl.label.update:
                    id: hvac_battery_label
                    text_color: white
                - lvgl.label.update:
                    id: weather_battery_label
                    text_color: white

  - id: update_bat_soc_arc
    then:
      - lvgl.arc.update:
          id: hvac_bat_soc_arc
          value: !lambda return id(battery_bat_soc).state;
      - lvgl.arc.update:
          id: weather_bat_soc_arc
          value: !lambda return id(battery_bat_soc).state;
      - lvgl.arc.update:
          id: train_bat_soc_arc
          value: !lambda return id(battery_bat_soc).state;
      - if:
          # condition:
          #   lambda: 'return id(battery_bat_charge).state > 0;'
          # then:
          #   # green indicator if charging
          #   - lvgl.arc.update:
          #       id: hvac_bat_soc_arc
          #       indicator:
          #         arc_color: color_battery_charge
          #   - lvgl.arc.update:
          #       id: weather_bat_soc_arc
          #       indicator:
          #         arc_color: color_battery_charge
          #   - lvgl.arc.update:
          #       id: train_bat_soc_arc
          #       indicator:
          #         arc_color: color_battery_charge
          # else:
          #   if:
              condition:
                lambda: 'return id(battery_bat_soc).state >= 20;'
              then:
                # normal indicator 20-100%
                - lvgl.arc.update:
                    id: hvac_bat_soc_arc
                    indicator:
                      arc_color: white
                - lvgl.arc.update:
                    id: weather_bat_soc_arc
                    indicator:
                      arc_color: white
                - lvgl.arc.update:
                    id: train_bat_soc_arc
                    indicator:
                      arc_color: white
              else:
                if:
                  condition:
                    lambda: 'return id(battery_bat_soc).state > 10;'
                  then:
                    # orange indicator 11-19%
                    - lvgl.arc.update:
                        id: hvac_bat_soc_arc
                        indicator:
                          arc_color: color_battery_med
                    - lvgl.arc.update:
                        id: weather_bat_soc_arc
                        indicator:
                          arc_color: color_battery_med
                    - lvgl.arc.update:
                        id: train_bat_soc_arc
                        indicator:
                          arc_color: color_battery_med
                  else:
                    # red indicator 0-10%
                    - lvgl.arc.update:
                        id: hvac_bat_soc_arc
                        indicator:
                          arc_color: color_battery_low
                    - lvgl.arc.update:
                        id: weather_bat_soc_arc
                        indicator:
                          arc_color: color_battery_low
                    - lvgl.arc.update:
                        id: train_bat_soc_arc
                        indicator:
                          arc_color: color_battery_low

  - id: update_bat_arc
    then:
      # Bat_charge_solar = max(solar – load, 0)
      #                  = excess solar -> battery or grid (if SoC full)
      - lvgl.arc.update:
          id: hvac_bat_charge_solar_arc
          value: !lambda return 10 * std::max(0.0f, id(battery_solar).state - id(battery_house_load).state);
      - lvgl.arc.update:
          id: weather_bat_charge_solar_arc
          value: !lambda return 10 * std::max(0.0f, id(battery_solar).state - id(battery_house_load).state);
      - lvgl.arc.update:
          id: train_bat_charge_solar_arc
          value: !lambda return 10 * std::max(0.0f, id(battery_solar).state - id(battery_house_load).state);

      # Bat_charge_grid = bat_charge – Bat_charge_solar
      - lvgl.arc.update:
          id: hvac_bat_charge_grid_arc
          value: !lambda return 10 * (id(battery_bat_charge).state - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state));
          start_angle: !lambda return std::min(119, 90 + int(30.0/5 * std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));
          max_value: !lambda return std::min(49.0f, 10 * (5 - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));
      - lvgl.arc.update:
          id: weather_bat_charge_grid_arc
          value: !lambda return 10 * (id(battery_bat_charge).state - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state));
          start_angle: !lambda return std::min(119, 90 + int(30.0/5 * std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));
          max_value: !lambda return std::min(49.0f, 10 * (5 - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));
      - lvgl.arc.update:
          id: train_bat_charge_grid_arc
          value: !lambda return 10 * (id(battery_bat_charge).state - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state));
          start_angle: !lambda return std::min(119, 90 + int(30.0/5 * std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));
          max_value: !lambda return std::min(49.0f, 10 * (5 - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));

      # Bat_discharge_grid = grid_export – Bat_charge_solar
      - lvgl.arc.update:
          id: hvac_bat_discharge_grid_arc
          value: !lambda return 10 * (id(battery_grid_export).state - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state));
          start_angle: !lambda return std::min(119, 90 + int(30.0/5 * std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));
          max_value: !lambda return std::min(49.0f, 10 * (5 - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));
      - lvgl.arc.update:
          id: weather_bat_discharge_grid_arc
          value: !lambda return 10 * (id(battery_grid_export).state - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state));
          start_angle: !lambda return std::min(119, 90 + int(30.0/5 * std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));
          max_value: !lambda return std::min(49.0f, 10 * (5 - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));
      - lvgl.arc.update:
          id: train_bat_discharge_grid_arc
          value: !lambda return 10 * (id(battery_grid_export).state - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state));
          start_angle: !lambda return std::min(119, 90 + int(30.0/5 * std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));
          max_value: !lambda return std::min(49.0f, 10 * (5 - std::max(0.0f, id(battery_solar).state - id(battery_house_load).state)));

  - id: update_load_arc
    then:
      # Load_solar = min(solar, load)
      #            = solar > load ? load : solar
      - lvgl.arc.update:
          id: hvac_load_solar_arc
          value: !lambda return 10 * std::min(id(battery_solar).state, id(battery_house_load).state);
      - lvgl.arc.update:
          id: weather_load_solar_arc
          value: !lambda return 10 * std::min(id(battery_solar).state, id(battery_house_load).state);
      - lvgl.arc.update:
          id: train_load_solar_arc
          value: !lambda return 10 * std::min(id(battery_solar).state, id(battery_house_load).state);

      # Load_battery = bat_discharge – grid_export
      - lvgl.arc.update:
          id: hvac_load_bat_arc
          value: !lambda return 10 * (id(battery_bat_discharge).state - id(battery_grid_export).state);
          end_angle: !lambda return std::max(61, 90 - int(30.0/5 * std::min(id(battery_solar).state, id(battery_house_load).state)));
          max_value: !lambda return std::max(0.0f, 10 * (5 - std::min(id(battery_solar).state, id(battery_house_load).state)));
      - lvgl.arc.update:
          id: weather_load_bat_arc
          value: !lambda return 10 * (id(battery_bat_discharge).state - id(battery_grid_export).state);
          end_angle: !lambda return std::max(61, 90 - int(30.0/5 * std::min(id(battery_solar).state, id(battery_house_load).state)));
          max_value: !lambda return std::max(0.0f, 10 * (5 - std::min(id(battery_solar).state, id(battery_house_load).state)));
      - lvgl.arc.update:
          id: train_load_bat_arc
          value: !lambda return 10 * (id(battery_bat_discharge).state - id(battery_grid_export).state);
          end_angle: !lambda return std::max(61, 90 - int(30.0/5 * std::min(id(battery_solar).state, id(battery_house_load).state)));
          max_value: !lambda return std::max(0.0f, 10 * (5 - std::min(id(battery_solar).state, id(battery_house_load).state)));

      # Load_grid = max(grid_import - bat_charge, 0)
      - if:
          condition:
            lambda: 'return id(battery_house_load).state <= 5;'
          then:
            - lvgl.arc.update:
                id: hvac_load_grid_arc
                value: !lambda return 10 * std::max(0.0f, id(battery_grid_import).state - id(battery_bat_charge).state);
                end_angle: !lambda return std::max(61, 90 - int(30.0/5 * (std::min(id(battery_solar).state, id(battery_house_load).state) + (id(battery_bat_discharge).state - id(battery_grid_export).state))));
                max_value: !lambda return std::max(0.0f, 10 * (5 - (std::min(id(battery_solar).state, id(battery_house_load).state) + (id(battery_bat_discharge).state - id(battery_grid_export).state))));
                mode: REVERSE
