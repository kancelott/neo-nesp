packages:
  colors: !include colors/palette.yaml

lvgl:
  buffer_size: 12%
  encoders:
    enter_button: push_button
    sensor: rotary
  on_idle:
    timeout: !lambda 'return (id(display_timeout).state * 1000);'
    then:
      - script.execute: goto_home_page
  scrollbar_mode: "OFF"
  bg_color: black
  text_color: white
  default_font: roboto_reg
  style_definitions:
    - id: style_menu_button
      align: CENTER
      bg_opa: TRANSP
      shadow_opa: TRANSP
      height: 50
      width: 50
      radius: 50%
    - id: style_menu_button_label
      align: CENTER
      y: 3
      text_font: roboto_med
  pages:

    ### GUI - THERMOSTAT HOME PAGE
    - id: hvac_page
      on_load:
        - script.execute:
            id: set_lvgl_page
            page_name: "hvac_page"
      widgets:
        - arc:
            height: 468
            width: 468
            align: CENTER
            arc_color: graylight
            arc_opa: COVER
            arc_width: 2
            arc_rounded: false
        - arc:
            id: current_temp_arc
            adjustable: True
            state:
              disabled: True
            min_value: 160    # 16°C (* 10 because decimals not supported)
            max_value: 300    # 30°C
            height: 468
            width: 468
            align: CENTER
            arc_color: graylight
            arc_opa: COVER
            arc_width: 2
            arc_rounded: false
            indicator:
              arc_color: graylight
              arc_opa: COVER
              arc_width: 2
              arc_rounded: false
            knob:
              bg_color: white
            value: 230
        - meter:
            height: 480
            width: 480
            align: CENTER
            bg_opa: TRANSP
            border_width: 0
            scales:
              range_from: 160   # 16°C (* 10 because decimals not supported)
              range_to: 300     # 30°C
              ticks:
                count: 89
                length: 37
                width: 3
                color: graylight
              indicators:
                - line:
                    id: set_temp_needle
                    color: white
                    value: 230
                    width: 8
                    r_mod: 8
                - arc:
                    id: diff_temp_arc
                    start_value: 160
                    end_value: 230
                    color: white
                    width: 2
                    r_mod: 8
        - obj:
            id: mode_bg
            width: 350
            height: 350
            radius: 175
            align: CENTER
            border_width: 0
            bg_color: black
        - label:
            id: mode_label
            align: CENTER
            y: -100
            text: "NESP"
        - roller:
            id: set_temp_roller
            state:
              disabled: True
            align: CENTER
            anim_duration: 500ms
            text_font: roboto_med
            text_opa: TRANSP
            bg_opa: TRANSP
            border_width: 0
            text_line_space: 30
            visible_row_count: 2
            selected:
              text_font: roboto_huge
              text_opa: COVER
              bg_opa: TRANSP
              border_width: 0
            options:
              - 16.0
              - 16.5
              - 17.0
              - 17.5
              - 18.0
              - 18.5
              - 19.0 
              - 19.5
              - 20.0
              - 20.5
              - 21.0
              - 21.5
              - 22.0
              - 22.5
              - 23.0
              - 23.5
              - 24.0
              - 24.5
              - 25.0
              - 25.5
              - 26.0
              - 26.5
              - 27.0
              - 27.5
              - 28.0
              - 28.5
              - 29.0
              - 29.5
              - 30.0
            selected_index: 14
        - label:
            id: celsius_label
            align: CENTER
            x: 100
            y: -43
            text: "°C"
        - label:
            id: big_fan_mode_icon
            hidden: True
            align: CENTER
            text_font: roboto_huge
            text: " "
        - label:
            id: current_temp_label
            align: CENTER
            y: 120
            text: " "
        # XXX disabled: to enable, comment out text_opa
        # XXX need to hide perimeter_label after
        - label:
            id: fan_icon_label
            align: CENTER
            y: 210
            text_font: roboto_med
            text: " "
            text_opa: TRANSP

    ### GUI - MAIN MENU
    - id: menu_page
      on_load:
        - script.execute:
            id: set_lvgl_page
            page_name: "menu_page"
        - script.execute: update_menu_date_label
        - lvgl.widget.enable:
            - menu_arm_button
            - menu_zone_2_button
            - menu_zone_1_button
            - menu_back_button
            - menu_mode_button
            - menu_preset_button
            - menu_fan_button
            - menu_train_button
            - menu_weather_button
        - lvgl.widget.focus: menu_mode_button
      on_unload:
        - lvgl.widget.disable:
            - menu_arm_button
            - menu_zone_2_button
            - menu_zone_1_button
            - menu_back_button
            - menu_mode_button
            - menu_preset_button
            - menu_fan_button
            - menu_train_button
            - menu_weather_button
      widgets:
        - label:
            id: menu_date_label
            align: LEFT_MID
            x: 45
            y: -65
            text_align: LEFT
            text_color: gray
            text: "SUN 1/01"
        - label:
            id: selected_menu_label
            align: CENTER
            x: 55
            text_font: roboto_med
            text_align: RIGHT
        - button:
            id: menu_arm_button
            hidden: True      # unhidden at _feature-alarm
            state:
              disabled: True
            x: -105
            y: -182
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F099D"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Arm\nAlarm"
            on_press:
              - script.execute: feature_menu_alarm_arm
        - button:
            id: menu_zone_2_button
            hidden: True      # unhidden at _feature-zones
            state:
              disabled: True
            x: 0
            y: -210
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F0D81"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Upstairs\nZone"
            on_press:
              - script.execute: feature_menu_zone_2_toggle
        - button:
            id: menu_zone_1_button
            hidden: True      # unhidden at _feature-zones
            state:
              disabled: True
            x: 105    # 210sin(30) clock coords
            y: -182   # 210cos(30)
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  align: CENTER
                  y: 3
                  text_font: roboto_med
                  text: "\U000F0D80"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Downstairs\nZone"
            on_press:
              - script.execute: feature_menu_zone_1_toggle
        - button:
            id: menu_back_button
            state:
              disabled: True
            x: 182
            y: -105
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F004D"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Back"
            on_press:
              - script.execute: goto_home_page
        - button:
            id: menu_mode_button
            state:
              disabled: True
            x: 210
            y: 0
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  id: menu_mode_button_label
                  styles: style_menu_button_label
                  text: "\U000F0425"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Mode"
            on_press:
              - script.execute: goto_mode_page
        - button:
            id: menu_preset_button
            state:
              disabled: True
            x: 182
            y: 105
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  id: menu_preset_button_label
                  styles: style_menu_button_label
                  text: "\U000F032A"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Presets"
            on_press:
              - script.execute: goto_preset_page
        - button:
            id: menu_fan_button
            state:
              disabled: True
            x: 105
            y: 182
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  id: menu_fan_button_label
                  styles: style_menu_button_label
                  text: "\U000F0210"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Fan\nSpeed"
            on_press:
              - script.execute: goto_fan_page
        - button:
            id: menu_weather_button
            hidden: True      # unhidden at _feature-weather
            state:
              disabled: True
            x: 0
            y: 210
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  id: menu_weather_button_label
                  styles: style_menu_button_label
                  text: "\U000F0599"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Weather"
            on_press:
              - script.execute: feature_menu_goto_weather_page
        - button:
            id: menu_train_button
            hidden: True      # unhidden at _feature-train
            state:
              disabled: True
            x: -105
            y: 182
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F052C"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Next\nTrain"
            on_press:
              - script.execute: feature_menu_goto_train_page

    ### GUI - HVAC MODE SUBMENU
    - id: mode_page
      on_load:
        - script.execute:
            id: set_lvgl_page
            page_name: "mode_page"
        - lvgl.widget.enable:
            - mode_back_button
            - mode_off_button
            - mode_heat_cool_button
            - mode_cool_button
            - mode_heat_button
            - mode_fan_button
            - mode_dry_button
        - lvgl.widget.focus: mode_cool_button
      on_unload:
        - lvgl.widget.disable:
            - mode_back_button
            - mode_off_button
            - mode_heat_cool_button
            - mode_cool_button
            - mode_heat_button
            - mode_fan_button
            - mode_dry_button
      widgets:
        - label:
            id: selected_mode_label
            align: CENTER
            x: 55
            text_font: roboto_med
            text_align: RIGHT
        - button:
            id: mode_back_button
            state:
              disabled: True
            x: 0
            y: -210
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F004D"
            on_focus:
              - lvgl.label.update:
                  id: selected_mode_label
                  text: "Back"
            on_press:
              - script.execute: goto_menu_page
        - button:
            id: mode_off_button
            state:
              disabled: True
            x: 105    # 210sin(30) clock coords
            y: -182   # 210cos(30)
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F0425"
            on_focus:
              - if:
                  condition:
                    text_sensor.state:
                      id: hvac_mode
                      state: "off"
                  then:
                    lvgl.label.update:
                      id: selected_mode_label
                      text: "Turn On"
                  else:
                    lvgl.label.update:
                      id: selected_mode_label
                      text: "Turn Off"
            on_press:
              - homeassistant.action:
                  action: climate.toggle
                  data:
                    entity_id: ${climate_entity}
              - script.execute: goto_home_page
        - button:
            id: mode_heat_cool_button
            state:
              disabled: True
            x: 182
            y: -105
            styles: style_menu_button
            focused:
              outline_color: pure_cyan
              outline_width: 3
              outline_pad: 3
            widgets:
              - label:
                  styles: style_menu_button_label
