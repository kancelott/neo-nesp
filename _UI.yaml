script:
  # HVAC UI LOGIC
  - id: set_mode_off
    then:
      - script.execute: goto_home_page
      - script.execute: hide_big_fan_widget
      - lvgl.label.update:
          id: mode_label
          text: "OFF"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: black
      - light.turn_off: rgb_ring
      - lvgl.label.update:
          id: menu_mode_button_label
          text_color: white
          text: "\U000F0425"
      - lvgl.widget.update:
          id: mode_heat_button
          text_color: white
      - lvgl.widget.update:
          id: mode_cool_button
          text_color: white
      - lvgl.widget.update:
          id: mode_fan_button
          text_color: white
      - lvgl.widget.update:
          id: mode_dry_button
          text_color: white
      - lvgl.widget.update:
          id: mode_heat_cool_button
          text_color: white
  - id: set_mode_heat
    then:
      - script.execute: goto_home_page
      - script.execute: hide_big_fan_widget
      - lvgl.label.update:
          id: mode_label
          text: "HEAT TO"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: color_heat
      - light.turn_on:
          id: rgb_ring
          brightness: 100%
          red:   1.000
          green: 0.533
          blue:  0.118
      - lvgl.label.update:
          id: menu_mode_button_label
          text_color: color_heat
          text: "\U000F0238"
      - lvgl.widget.update:
          id: mode_heat_button
          text_color: color_heat
      - lvgl.widget.update:
          id: mode_cool_button
          text_color: white
      - lvgl.widget.update:
          id: mode_fan_button
          text_color: white
      - lvgl.widget.update:
          id: mode_dry_button
          text_color: white
      - lvgl.widget.update:
          id: mode_heat_cool_button
          text_color: white
  - id: set_mode_cool
    then:
      - script.execute: goto_home_page
      - script.execute: hide_big_fan_widget
      - lvgl.label.update:
          id: mode_label
          text: "COOL TO"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: color_cool
      - light.turn_on:
          id: rgb_ring
          brightness: 100%
          red:   0.498
          green: 0.675
          blue:  1.000
      - lvgl.label.update:
          id: menu_mode_button_label
          text_color: color_cool
          text: "\U000F0717"
      - lvgl.widget.update:
          id: mode_heat_button
          text_color: white
      - lvgl.widget.update:
          id: mode_cool_button
          text_color: color_cool
      - lvgl.widget.update:
          id: mode_fan_button
          text_color: white
      - lvgl.widget.update:
          id: mode_dry_button
          text_color: white
      - lvgl.widget.update:
          id: mode_heat_cool_button
          text_color: white
  - id: set_mode_fan
    then:
      - script.execute: goto_home_page
      - script.execute: show_big_fan_widget
      - lvgl.label.update:
          id: mode_label
          text: "FAN ONLY"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: color_fan
      - light.turn_on:
          id: rgb_ring
          brightness: 100%
          red:   0.749
          green: 0.980
          blue:  1.000
      - lvgl.label.update:
          id: menu_mode_button_label
          text_color: color_fan
          text: "\U000F0210"
      - lvgl.widget.update:
          id: mode_heat_button
          text_color: white
      - lvgl.widget.update:
          id: mode_cool_button
          text_color: white
      - lvgl.widget.update:
          id: mode_fan_button
          text_color: color_fan
      - lvgl.widget.update:
          id: mode_dry_button
          text_color: white
      - lvgl.widget.update:
          id: mode_heat_cool_button
          text_color: white
  - id: set_mode_dry
    then:
      - script.execute: goto_home_page
      - script.execute: hide_big_fan_widget
      - lvgl.label.update:
          id: mode_label
          text: "DEHUMIDIFY"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: color_dry
      - light.turn_on:
          id: rgb_ring
          brightness: 100%
          red:   1.000
          green: 0.753
          blue:  0.549
      - lvgl.label.update:
          id: menu_mode_button_label
          text_color: color_dry
          text: "\U000F058E"
      - lvgl.widget.update:
          id: mode_heat_button
          text_color: white
      - lvgl.widget.update:
          id: mode_cool_button
          text_color: white
      - lvgl.widget.update:
          id: mode_fan_button
          text_color: white
      - lvgl.widget.update:
          id: mode_dry_button
          text_color: color_dry
      - lvgl.widget.update:
          id: mode_heat_cool_button
          text_color: white
  - id: set_mode_heat_cool
    then:
      - script.execute: goto_home_page
      - script.execute: hide_big_fan_widget
      - lvgl.label.update:
          id: mode_label
          text: "AUTO TO"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: graylight
      - light.turn_on:
          id: rgb_ring
          brightness: 100%
          red:   1.000
          green: 0.894
          blue:  0.804
      - lvgl.label.update:
          id: menu_mode_button_label
          text_color: color_heat_cool
          text: "\U000F1A79"
      - lvgl.widget.update:
          id: mode_heat_button
          text_color: white
      - lvgl.widget.update:
          id: mode_cool_button
          text_color: white
      - lvgl.widget.update:
          id: mode_fan_button
          text_color: white
      - lvgl.widget.update:
          id: mode_dry_button
          text_color: white
      - lvgl.widget.update:
          id: mode_heat_cool_button
          text_color: color_heat_cool

  - id: update_diff_temp_arc
    then:
      - lvgl.indicator.update:
          id: diff_temp_arc
          start_value: !lambda |-
            return id(set_temperature).state < id(current_temperature).state ? id(set_temperature).state * 10 : id(current_temperature).state * 10;
          end_value: !lambda |-
            return id(set_temperature).state < id(current_temperature).state ? id(current_temperature).state * 10 : id(set_temperature).state * 10;

  - id: show_big_fan_widget
    then:
      - lvgl.widget.hide:
          - current_temp_arc
          - set_temp_roller
          - celsius_label
          - current_temp_label
          - fan_icon_label
      - lvgl.indicator.update:
          id: set_temp_needle
          opa: TRANSP
      - lvgl.indicator.update:
          id: diff_temp_arc
          opa: TRANSP
      - lvgl.widget.show:
          - big_fan_mode_icon
  - id: hide_big_fan_widget
    then:
      - lvgl.widget.hide:
          - big_fan_mode_icon
      - lvgl.widget.show:
          - current_temp_arc
          - set_temp_roller
          - celsius_label
          - current_temp_label
          - fan_icon_label
      - lvgl.indicator.update:
          id: set_temp_needle
          opa: COVER
      - lvgl.indicator.update:
          id: diff_temp_arc
          opa: COVER

  # MENU UI LOGIC
  - id: update_menu_date_label
    then:
      - lvgl.label.update:
          id: menu_date_label
          text: !lambda |-
            auto now = id(hass_time).now();
            static const char * const day_names[] = {"SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"};
            static char buf[10];
            snprintf(buf, sizeof(buf), "%s %d/%02d", day_names[now.day_of_week-1], now.day_of_month, now.month);
            return buf;

  # PRESET UI LOGIC
  - id: set_preset_none
    then:
      - lvgl.label.update:
          id: menu_preset_button_label
          text_color: white
          text: "\U000F032A"
      - lvgl.widget.update:
          id: preset_eco_button
          text_color: white
      - lvgl.widget.update:
          id: preset_comfort_button
          text_color: white
      - lvgl.widget.update:
          id: preset_boost_button
          text_color: white
  - id: set_preset_eco
    then:
      - lvgl.label.update:
          id: menu_preset_button_label
          text_color: green
          text: "\U000F032A"
      - lvgl.widget.update:
          id: preset_eco_button
          text_color: green
      - lvgl.widget.update:
          id: preset_comfort_button
          text_color: white
      - lvgl.widget.update:
          id: preset_boost_button
          text_color: white
  - id: set_preset_comfort
    then:
      - lvgl.label.update:
          id: menu_preset_button_label
          text_color: amber
          text: "\U000F04B9"
      - lvgl.widget.update:
          id: preset_eco_button
          text_color: white
      - lvgl.widget.update:
          id: preset_comfort_button
          text_color: amber
      - lvgl.widget.update:
          id: preset_boost_button
          text_color: white
  - id: set_preset_boost
    then:
      - lvgl.label.update:
          id: menu_preset_button_label
          text_color: red
          text: "\U000F14DE"
      - lvgl.widget.update:
          id: preset_eco_button
          text_color: white
      - lvgl.widget.update:
          id: preset_comfort_button
          text_color: white
      - lvgl.widget.update:
          id: preset_boost_button
          text_color: red

  # FAN UI LOGIC
  - id: set_fan_auto
    then:
      - lvgl.label.update:
          id: big_fan_mode_icon
          text: "\U000F171D"
      - lvgl.label.update:
          id: fan_icon_label
          text: "\U000F171D"
      - lvgl.label.update:
          id: menu_fan_button_label
          text: "\U000F171D"
  - id: set_fan_low
    then:
      - lvgl.label.update:
          id: big_fan_mode_icon
          text: "\U000F1472"
      - lvgl.label.update:
          id: fan_icon_label
          text: "\U000F1472"
      - lvgl.label.update:
          id: menu_fan_button_label
          text: "\U000F1472"
  - id: set_fan_medium
    then:
      - lvgl.label.update:
          id: big_fan_mode_icon
          text: "\U000F1473"
      - lvgl.label.update:
          id: fan_icon_label
          text: "\U000F1473"
      - lvgl.label.update:
          id: menu_fan_button_label
          text: "\U000F1473"
  - id: set_fan_high
    then:
      - lvgl.label.update:
          id: big_fan_mode_icon
          text: "\U000F1474"
      - lvgl.label.update:
          id: fan_icon_label
          text: "\U000F1474"
      - lvgl.label.update:
          id: menu_fan_button_label
          text: "\U000F1474"

  # MISC - PAGE NAVIGATION
  - id: goto_home_page
    then:
      if:
        condition:
          lambda: 'return id(feature_train_enabled) == 1 && id(hvac_mode).state != "off" && id(hass_time).now().day_of_week != 1 && id(hass_time).now().day_of_week != 7 && id(hass_time).now().hour >= 7 && id(hass_time).now().hour <= 8;'
        then:
          script.execute: goto_train_page
        else:
          if:
            condition:
              lambda: 'return id(feature_weather_enabled) == 1 && id(hvac_mode).state == "off";'
            then:
              script.execute: goto_weather_page
            else:
              script.execute: goto_hvac_page
  - id: goto_hvac_page
    then:
      - lvgl.page.show:
          id: hvac_page
          animation: FADE_IN
          time: 500ms
  - id: goto_menu_page
    then:
      - lvgl.page.show:
          id: menu_page
          animation: FADE_IN
          time: 500ms
  - id: goto_mode_page
    then:
      - lvgl.page.show:
          id: mode_page
          animation: FADE_IN
          time: 500ms
  - id: goto_preset_page
    then:
      - lvgl.page.show:
          id: preset_page
          animation: FADE_IN
          time: 500ms
  - id: goto_fan_page
    then:
      - lvgl.page.show:
          id: fan_page
          animation: FADE_IN
          time: 500ms

  - id: set_lvgl_page
    parameters:
      page_name: string
    then:
      - globals.set:
          id: active_lvgl_page
          value: !lambda return page_name.c_str();
      - text_sensor.template.publish:
          id: current_screen
          state: !lambda return id(active_lvgl_page).c_str();

  # MISC - FEATURE PLACEHOLDER SCRIPTS
  - id: goto_weather_page               # defined in _feature-weather.yaml
    then:
      - delay: 1ms
  - id: goto_alarm_page                 # defined in _feature-alarm.yaml
    then:
      - delay: 1ms
  - id: goto_train_page                 # defined in _feature-train.yaml
    then:
      - delay: 1ms
  - id: feature_menu_alarm_arm          # defined in _feature-alarm.yaml
    then:
      - delay: 1ms
  - id: feature_menu_zone_1_toggle      # defined in _feature-zones.yaml
    then:
      - delay: 1ms
  - id: feature_menu_zone_2_toggle      # defined in _feature-zones.yaml
    then:
      - delay: 1ms
  - id: feature_menu_goto_weather_page  # defined in _feature-train.yaml
    then:
      - delay: 1ms
  - id: feature_menu_goto_train_page    # defined in _feature-train.yaml
    then:
      - delay: 1ms

  # MISC - VIBRATION MOTOR SCRIPT
  - id: vibrate
    parameters:
      length_ms: int
    then:
      # XXX doesn't seem to delay properly for short lengths (10-100ms)
      - switch.turn_on: vibration
      - delay: !lambda return length_ms;
      - switch.turn_off: vibration
