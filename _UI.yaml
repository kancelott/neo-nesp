#
# neo-nesp climate UI
#

globals:
  - id: active_lvgl_page
    type: std::string

  # to be set by _feature-*.yaml files
  - id: feature_zones_enabled
    type: int
    initial_value: '0'
  - id: feature_solar_enabled
    type: int
    initial_value: '0'
  - id: feature_battery_enabled
    type: int
    initial_value: '0'
  - id: feature_weather_enabled
    type: int
    initial_value: '0'
  - id: feature_alarm_enabled
    type: int
    initial_value: '0'
  - id: feature_train_enabled
    type: int
    initial_value: '0'

time:
  - id: hass_time
    platform: homeassistant
    on_time:
      - hours: 2,3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 2,3,4,5
        minutes: 35
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn
      - hours: 0
        minutes: 0
        seconds: 0
        then:
          - script.execute: update_menu_date_label

binary_sensor:
  ### CENTRE PUSH BUTTON ACTIONS
  - id: !extend push_button
    on_click:
      min_length: 50ms
      max_length: 200ms
      then:
        #- script.execute:
        #    id: vibrate
        #    length_ms: 10
        - light.turn_on: backlight
        - if:
            condition: lvgl.is_paused
            then:
              - lvgl.resume:
              - lvgl.widget.redraw:
        - if:
            condition:
              # only when on the main page
              lambda: |-
                return (strcmp(id(active_lvgl_page).c_str(), "hvac_page") == 0
                  || strcmp(id(active_lvgl_page).c_str(), "weather_page") == 0
                  || strcmp(id(active_lvgl_page).c_str(), "train_page") == 0
                );
            then:
              - script.execute: goto_menu_page

button:
  - platform: template
    name: Show Home screen
    on_press:
      - script.execute: goto_home_page

  - platform: template
    name: Show Climate screen
    on_press:
      - script.execute: goto_hvac_page

sensor:
  ### ROTARY ENCODER ACTIONS
  - id: !extend rotary
    on_value:
      - light.turn_on: backlight
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
    on_clockwise:
      - if:
          condition:
            # set temp++ when on home page and not OFF or FAN
            lambda: |-
              return (strcmp(id(active_lvgl_page).c_str(), "hvac_page") == 0
                && id(hvac_mode).state != "off"
                && id(hvac_mode).state != "fan_only"
                );
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: ${climate_entity}
                  temperature: !lambda return id(set_temperature).state + 0.5;
      - if:
          condition:
            lambda: |-
              return (strcmp(id(active_lvgl_page).c_str(), "train_page") == 0
                && id(hvac_mode).state != "off"
                );
          then:
            - script.execute: goto_hvac_page
    on_anticlockwise:
      - if:
          condition:
            # set temp-- when on home page and not OFF or FAN
            lambda: |-
              return (strcmp(id(active_lvgl_page).c_str(), "hvac_page") == 0 
                && id(hvac_mode).state != "off"
                && id(hvac_mode).state != "fan_only"
                );
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: ${climate_entity}
                  temperature: !lambda return id(set_temperature).state - 0.5;
      - if:
          condition:
            lambda: |-
              return (strcmp(id(active_lvgl_page).c_str(), "train_page") == 0
                && id(hvac_mode).state != "off"
                );
          then:
            - script.execute: goto_hvac_page

  ### HASS - HVAC SET TEMP
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: set_temperature
    attribute: temperature
    internal: true
    on_value:
      - lvgl.indicator.update:
          id: set_temp_needle
          value: !lambda return x * 10;
      - script.execute: update_diff_temp_arc
      - lvgl.roller.update:
          id: set_temp_roller
          selected_index: !lambda return 2 * (x - 16);  # returns index of roller value

  ### HASS - HVAC CURRENT TEMP
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: current_temperature
    attribute: current_temperature
    internal: true
    filters:
      - round: 1
    on_value:
      - lvgl.arc.update:
          id: current_temp_arc
          value: !lambda return x * 10;
      - script.execute: update_diff_temp_arc
      - lvgl.label.update:
          id: current_temp_label
          text:
            format: "%.1f°C"
            args: [ 'x' ]

  ### HASS - HVAC CURRENT HUMIDITY
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: current_humidity
    attribute: current_humidity
    internal: true

text_sensor:
  ### HASS - HVAC MODE
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: hvac_mode
    internal: true
    on_value:
      - lambda: |-
          if (x.compare("off") == 0) {
            id(set_mode_off).execute();
          } else if (x.compare("heat") == 0) {
            id(set_mode_heat).execute();
          } else if (x.compare("cool") == 0) {
            id(set_mode_cool).execute();
          } else if (x.compare("fan_only") == 0) {
            id(set_mode_fan).execute();
          } else if (x.compare("dry") == 0) {
            id(set_mode_dry).execute();
          } else if (x.compare("heat_cool") == 0) {
            id(set_mode_heat_cool).execute();
          }

  ### HASS - HVAC FAN SPEED
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: fan_mode
    attribute: fan_mode
    internal: true
    on_value:
      - lambda: |-
          if (x.compare("auto") == 0) {
            id(set_fan_auto).execute();
          } else if (x.compare("low") == 0) {
            id(set_fan_low).execute();
          } else if (x.compare("medium") == 0) {
            id(set_fan_medium).execute();
          } else if (x.compare("high") == 0) {
            id(set_fan_high).execute();
          }

  ### HASS - HVAC PRESET
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: preset_mode
    attribute: preset_mode
    internal: true
    on_value:
      - lambda: |-
          if (x.compare("none") == 0) {
            id(set_preset_none).execute();
          } else if (x.compare("eco") == 0) {
            id(set_preset_eco).execute();
          } else if (x.compare("comfort") == 0) {
            id(set_preset_comfort).execute();
          } else if (x.compare("boost") == 0) {
            id(set_preset_boost).execute();
          }

  ### current LVGL screen
  - platform: template
    name: Current screen
    id: current_screen
    icon: mdi:dock-window

switch:
  ### DISPLAY ANTI BURN-IN
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    internal: true
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - light.turn_off: backlight
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - delay: 1s
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on: backlight

